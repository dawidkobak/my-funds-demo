<mat-card class="vertical-tab-group-body" fxFlex="auto">
  <mat-card-header>
    <mat-card-title fxLayout="row" fxLayoutGap="20px" fxLayoutAlign="start center">
      <div fxLayout="row" fxLayoutGap="15px" fxLayoutAlign="start center">
        <span>Portfele</span>
      </div>
    </mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <mat-table fxLayout="column" [dataSource]="wallets">
      <ng-container matColumnDef="name">
        <mat-header-cell *matHeaderCellDef> Nazwa portfela</mat-header-cell>
        <mat-cell *matCellDef="let wallet"> {{ wallet.name }}</mat-cell>
      </ng-container>
      <ng-container matColumnDef="modifications">
        <mat-header-cell *matHeaderCellDef> Modyfikacje</mat-header-cell>
        <mat-cell *matCellDef="let wallet">
          <button [disabled]="staticDemo" mat-stroked-button (click)="openModifyDialog(wallet)" class="edit-button">
            <fa-icon [icon]="['fas', 'pen-to-square']"></fa-icon>
            Edytuj
          </button>
          <button [disabled]="staticDemo" mat-stroked-button (click)="openDeleteDialog(wallet)" class="delete-button">
            <fa-icon [icon]="['fas', 'trash']"></fa-icon>
            Usuń
          </button>
        </mat-cell>
      </ng-container>
      <mat-header-row *matHeaderRowDef="['name', 'modifications']"></mat-header-row>
      <mat-row *matRowDef="let row; columns: ['name', 'modifications'];"></mat-row>
    </mat-table>
  </mat-card-content>
</mat-card>
